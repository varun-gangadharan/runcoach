name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The shared science core is a submodule, and the tests import its fixture
      # file directly — without it nothing resolves.
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # No database and no credentials: the tools run against the same fixtures
      # Runman's core is validated with.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
